---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seerr-certificate
  namespace: seerr
spec:
  commonName: seerr.lan.juusoleinonen.fi
  secretName: seerr-certificate
  dnsNames:
    - seerr.lan.juusoleinonen.fi
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: seerr-lan-only
  namespace: seerr
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/16
      - 10.0.10.0/24

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr
  namespace: seerr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`seerr.lan.juusoleinonen.fi`)
      priority: 10
      middlewares:
        - name: seerr-lan-only
      services:
        - name: seerr
          port: 5055
  tls:
    secretName: seerr-certificate
